# Dependency version updates for the turva.dev site Worker.
# The npm project is the inner turva-worker folder, not the repository root.
# Grouped into one pull request per week so the review is one read, not five.
# Note: this file covers version updates only. Dependabot security updates and
# the alerts behind them are a repository setting (Settings > Code security),
# not something this file can enable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /turva-worker
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    ignore:
      # @cloudflare/workers-types is held on the same ^4 line as in turva-mcp (mds/decisions.md
      # Tek-73, Tek-387), so both Workers are type-checked against the same platform types. The
      # `overrides` entry in package.json answers wrangler's optional ^5 peer; without it npm
      # install fails with ERESOLVE. The two repositories move to ^5 together, by hand.
      - dependency-name: "@cloudflare/workers-types"
        update-types: ["version-update:semver-major"]
      # @types/node is held on major 22 because the types' major tracks the Node major and
      # engines declares a lower bound of ^22.18.0 (CI runs Node 22, 24 and 26), so a major jump
      # would type the tests against APIs the oldest supported Node lacks (Tek-663).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      all-dependencies:
        patterns:
          - "*"
  # The actions in .github/workflows are pinned to full commit SHAs, and a pin
  # without an updater only gets older. This block opens a pull request when a
  # pinned action has a new release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Helsinki
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      all-actions:
        patterns:
          - "*"
