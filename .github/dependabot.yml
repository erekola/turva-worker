# Dependency version updates for the turva.dev site Worker.
# The npm project is the inner turva-worker folder, not the repository root.
# Grouped into one pull request per week so the review is one read, not five.
# Note: this file covers version updates only. Dependabot security updates and
# the alerts behind them are a repository setting (Settings > Code security),
# not something this file can enable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /turva-worker
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      all-dependencies:
        patterns:
          - "*"
  # The actions in .github/workflows are pinned to full commit SHAs, and a pin
  # without an updater only gets older. This block opens a pull request when a
  # pinned action has a new release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Helsinki
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      all-actions:
        patterns:
          - "*"
