name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    # The repo had no workflow at all until 2026-09-10 (Tek-384): the tests and the verify
    # chain existed and nothing ran them on a change. What runs here is what this REPO can
    # check on its own, which is not the whole release gate: the ship script runs a wider
    # verify from the private workspace, and this one is a subset of it (mds/gotchas.md
    # 2026-09-09 (jatko 2), where the repo's own verify was green while the ship failed).
    # The --live half is deliberately absent: it measures the deployed site, so it is a
    # report after a ship and cannot be a gate before one.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Since v3.154.0 src/worker.js imports one npm package, markdown-parity-check, for the
      # hosted parity check, and tools/verify.mjs resolves it too. Only the runtime dependencies
      # are installed, from the lock: --omit=dev leaves out wrangler, which the tests do not need,
      # and --ignore-scripts runs no package install script. Without this step both jobs fail on
      # ERR_MODULE_NOT_FOUND (run 13, commit 143d2e3).
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: turva-worker
      - run: node --test
        working-directory: turva-worker
      - run: node tools/verify.mjs
